<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LUCCNT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&family=Plus+Jakarta+Sans:wght@200;300;400;500&display=swap">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body data-mode="playful" data-filter="all">

  <!-- TOP BAR: BERLIN MINIMALISM (Hairline 1px, Thin Typography) -->
  <header class="hud-top">
    <div class="hud-left">
      <button class="brand-btn" id="selfNodeBtn" type="button">
        <span class="shape-indicator"></span>
        <span class="brand-title">luccnt</span>
        <span class="brand-meta">/ index 26</span>
      </button>
    </div>

    <!-- 7 FILTRI MANSIONE SOTTILI -->
    <nav class="hud-filters" aria-label="Discipline">
      <button class="flt on" data-role="all" type="button">All (10)</button>
      <button class="flt" data-role="art-direction" type="button">Art Direction</button>
      <button class="flt" data-role="graphic" type="button">Visual &amp; Graphic</button>
      <button class="flt" data-role="ui-ux" type="button">UI/UX</button>
      <button class="flt" data-role="photo" type="button">Photo</button>
      <button class="flt" data-role="video" type="button">Video</button>
      <button class="flt" data-role="copywriting" type="button">Copywriting</button>
      <button class="flt" data-role="pm" type="button">Project Management</button>
    </nav>

    <!-- AUDIO REACTIVE + DOWNLOAD ZIP DIRETTAMENTE DALLA UI -->
    <div class="hud-right">
      <audio id="bgAudio" src="assets/ambient-track.mp3" loop crossorigin="anonymous"></audio>
      <button class="util-btn" id="audioToggle" type="button" aria-pressed="false">
        <span class="eq-mini" id="eqBars"><i></i><i></i><i></i></span>
        <span class="audio-lbl">sound: off</span>
      </button>
    </div>
  </header>

  <!-- TELA CARTESIANA BERLINESE -->
  <main class="mind-stage" id="mindStage">
    <div class="berlin-grid" aria-hidden="true">
      <span class="c-mark tl">+ 52.5200° N / 45.0703° N</span>
      <span class="c-mark tr" id="cursorCoords">x: 000 · y: 000</span>
      <span class="c-mark bl" id="shapeStateLabel">shape: organic circle (playful)</span>
      <span class="c-mark br" id="activeFilterLabel">view: all disciplines</span>
    </div>

    <!-- Canvas per fili 0.75px, scia geometrica sottile e onde sub-bass -->
    <canvas id="synapseCanvas"></canvas>

    <!-- Nodi con Hover puramente Fotografico/Visivo e Forme Mutanti -->
    <div class="nodes-layer" id="nodesLayer"></div>
  </main>

  <!-- BOTTOM BAR: LUC'S INNER THOUGHTS + SWITCH SEMAFORO (CAMBIA FORMA E TONO) -->
  <footer class="hud-bottom">
    <div class="inner-thoughts">
      <span class="thought-prefix">luc's inner thoughts —</span>
      <p class="thought-stream" id="thoughtStream">
        sfiora i nodi per aprire i frame visivi. cambia stato a destra per mutare geometria e pensiero.
      </p>
    </div>

    <div class="mode-switch" role="group" aria-label="Stato e Geometria">
      <button class="m-btn on" data-set-mode="playful" type="button" title="Geometria Circolare / Tono Playful">
        <span class="dot d-green"></span>
        <span>playful</span>
      </button>
      <button class="m-btn" data-set-mode="invested" type="button" title="Geometria Ortogonale / Tono Invested">
        <span class="dot d-yellow"></span>
        <span>invested</span>
      </button>
      <button class="m-btn" data-set-mode="fuckedup" type="button" title="Geometria Poligonale Tagliata / Tono Fucked Up">
        <span class="dot d-red"></span>
        <span>fucked up</span>
      </button>
    </div>
  </footer>

  <!-- DRAWER STUDIO PROGETTO (Apre al click sul nodo, layout editoriale berlinese) -->
  <aside class="study-drawer" id="studyDrawer" aria-hidden="true">
    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <div class="drawer-panel">
      <header class="drawer-hd">
        <div class="drawer-meta">
          <span id="dwId">01</span>
          <span id="dwRoles"></span>
        </div>
        <button class="drawer-close" id="drawerClose" type="button">close [esc]</button>
      </header>
      <div class="drawer-body" id="dwBody"></div>
    </div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
